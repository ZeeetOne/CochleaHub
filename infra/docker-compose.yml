# Local development stack mirroring the AWS target (D8):
#   PostgreSQL  -> Amazon RDS for PostgreSQL   (specimens, runs, measurements, QC)
#   Orthanc     -> Orthanc on EC2 / AWS HealthImaging (CBCT archive, DICOMweb)
#   SeaweedFS   -> Amazon S3                   (meshes; same S3 API, only the endpoint differs)
#   Ollama      -> local LLM inside the hospital network (optional, profile local-llm, D20)
#   Grafana     -> comparison prototype of the Operations view (optional, profile grafana, D22)
# Run from repo root:
#   docker compose -f infra/docker-compose.yml --env-file .env up -d
#   docker compose -f infra/docker-compose.yml --env-file .env --profile local-llm up -d
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie  # PostgreSQL 17 + pgvector (also on Amazon RDS)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cochleahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cochleahub}
      POSTGRES_DB: ${POSTGRES_DB:-cochleahub}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cochleahub}"]
      interval: 5s
      retries: 10

  orthanc:
    image: orthancteam/orthanc:latest
    environment:
      ORTHANC__NAME: CochleaHub
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__DICOM_WEB__ROOT: /dicom-web/
      # Local development only: no authentication. Never expose this configuration publicly;
      # on AWS, Orthanc sits in a private subnet behind the API (stage 8).
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
    ports:
      - "8042:8042"
    volumes:
      - orthanc-db:/var/lib/orthanc/db

  # S3-compatible object store. MinIO images could not be pulled (Oct 2026), so SeaweedFS's
  # S3 gateway is used; boto3 talks to it exactly as to Amazon S3.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data

  # Local open-weight LLM for the assistant's "local" backend: no request leaves the machine.
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Stage 8 comparison prototype (D22): the Operations view in Grafana, read-only on the same
  # database. Run infra/grafana/readonly.sql once first. Local only: anonymous viewer access.
  grafana:
    image: grafana/grafana-oss:latest
    profiles: ["grafana"]
    depends_on: [postgres]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/operations.json
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
  orthanc-db:
  s3-data:
  ollama:
