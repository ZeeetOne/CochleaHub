[project]
name = "cochleahub"
version = "0.1.0"
description = "Temporal bone CT measurement pipeline, API and AI assistant for cochlear implant research (OpenEar dataset)"
requires-python = ">=3.11"
dependencies = [
    # pipeline (stage 2-3)
    "SimpleITK>=2.4",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "trimesh>=4.4",
    "fast-simplification>=0.1",
    "pydicom>=3.0",
    # api + storage (stage 4-5)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "boto3>=1.35",
    "alembic>=1.14",
    # assistant (stage 7)
    "anthropic>=2.3",
    "ollama>=0.6",
    "fastembed>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cochleahub = "cochleahub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cochleahub"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
