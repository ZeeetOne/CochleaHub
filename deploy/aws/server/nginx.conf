# Edge of the EC2 instance (D23). Only CloudFront reaches port 80 (security group allows the
# CloudFront origin-facing prefix list only), and every request must carry the secret header
# CloudFront adds, so the instance cannot be used directly even from inside AWS.
# ORIGIN_SECRET is substituted by the bootstrap script.

server {
    listen 80 default_server;
    client_max_body_size 1m;

    if ($http_x_origin_verify != "ORIGIN_SECRET") {
        return 403;
    }

    # FastAPI: read-only data routes + the assistant (SSE, so no buffering)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Orthanc DICOMweb, read-only: QIDO-RS and WADO-RS are GETs; STOW-RS (POST) and Orthanc's
    # REST API (uploads, deletes, settings) are not reachable from outside (D8, D17).
    location /dicom-web/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://orthanc:8042/dicom-web/;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
