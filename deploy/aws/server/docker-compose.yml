# Runtime on the single EC2 instance (D23, cost-saving variant). Mirrors infra/docker-compose.yml
# except: meshes live in real Amazon S3 (instance role, no keys), and nginx is the only
# published port. Production would move PostgreSQL to RDS and Orthanc behind a private subnet.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: cochleahub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cochleahub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cochleahub"]
      interval: 5s
      retries: 20

  orthanc:
    image: orthancteam/orthanc:latest
    restart: unless-stopped
    environment:
      ORTHANC__NAME: CochleaHub
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__DICOM_WEB__ROOT: /dicom-web/
      # reachable only on the internal Docker network; nginx exposes DICOMweb GETs only
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
    volumes:
      - orthanc-db:/var/lib/orthanc/db

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    mem_limit: 1200m  # t3.small has 2 GB; leaves room for PostgreSQL and Orthanc

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [api, orthanc]
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  orthanc-db:
